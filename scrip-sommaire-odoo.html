<div style="max-width:100%; text-align:center; padding: 10px;">
    <button id="goto-toc">📖 Sommaire</button>
  <button id="prev">Précédent</button>
  <span id="page-info"></span>
  <button id="next">Suivant</button>
  <br>
  <div id="pdf-viewer" style="position:relative; display:inline-block; width:100%; max-width:1000px; height:80vh; border:1px solid #ccc; overflow:auto; margin:10px auto; background:#f5f5f5; padding:10px;"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
<script>

const url = 'https://florian-denis-dev.github.io/catalogue-2026/2026-fixon-catalogue_compressed.pdf';

const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';

let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null;

const container = document.getElementById('pdf-viewer');
const pageInfo = document.getElementById('page-info');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const tocBtn = document.getElementById('goto-toc');

function renderPage(num) {
  pageRendering = true;
  container.innerHTML = '';

  const isDoublePage = num > 1;
  const pagesToRender = isDoublePage ? [num, num + 1] : [num];

  let wrapper = document.createElement('div');
  wrapper.style.display = 'flex';
  wrapper.style.justifyContent = 'center';
  wrapper.style.gap = '10px';
  wrapper.style.width = '100%';
  wrapper.style.position = 'relative';

  let renderCount = 0;

  pagesToRender.forEach((pageNumber, index) => {
    if (pageNumber > pdfDoc.numPages) return;

    pdfDoc.getPage(pageNumber).then(function(page) {
      let viewport = page.getViewport({scale: isDoublePage ? 0.80 : 0.82});

      // Canvas
      let canvas = document.createElement('canvas');
      let context = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.border = '1px solid #ddd';
      canvas.style.boxShadow = '0 2px 8px rgba(0,0,0,0.1)';
      canvas.style.position = 'relative';
      wrapper.appendChild(canvas);

      let linkLayer = document.createElement('div');
      linkLayer.style.position = 'absolute';
      linkLayer.style.left = canvas.offsetLeft + 'px';
      linkLayer.style.top = canvas.offsetTop + 'px';
      linkLayer.style.width = canvas.width + 'px';
      linkLayer.style.height = canvas.height + 'px';
      linkLayer.style.zIndex = 30;
      linkLayer.style.pointerEvents = 'none'; // ENBLE pour TOUT, mais on remet en "auto" pour chaque link
      wrapper.appendChild(linkLayer);

      // Rendu
      let renderContext = {
        canvasContext: context,
        viewport: viewport
      };
      let renderTask = page.render(renderContext);

      renderTask.promise.then(function () {
        // Générer le layer annotation (pour les liens)
        page.getAnnotations().then(function(annots) {
          annots.forEach(function(annot) {
            if (annot.subtype === 'Link' && annot.rect) {
              let bounds = pdfjsLib.Util.normalizeRect(annot.rect);

              // Position par rapport au canvas
              let x = bounds[0] * viewport.scale;
              let y = (viewport.height - bounds[3] * viewport.scale);

              let width = (bounds[2] - bounds[0]) * viewport.scale;
              let height = (bounds[3] - bounds[1]) * viewport.scale;

              // On utilise un <div> interactif
              let linkDiv = document.createElement('div');
              linkDiv.setAttribute('role','button');
              linkDiv.setAttribute('tabindex','0');
              linkDiv.style.position = 'absolute';
              linkDiv.style.left = x + 'px';
              linkDiv.style.top = y + 'px';
              linkDiv.style.width = width + 'px';
              linkDiv.style.height = height + 'px';
              linkDiv.style.zIndex = 100;
              linkDiv.style.background = 'rgba(255,255,0,0.0)';
              linkDiv.title = 'Aller au lien';
              linkDiv.style.cursor = 'pointer';
              linkDiv.style.pointerEvents = 'auto';

              // Interne (PDF)
                if (annot.dest) {
                    linkDiv.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        let dest = annot.dest;
                          // Récupération efficace (existant)
                        let refObj = (Array.isArray(dest) && dest[0] && typeof dest[0] === 'object') ? dest[0] : dest;
                        pdfDoc.getPageIndex(refObj).then(function(pageIndex) {
                            let pageTarget = Number(pageIndex) + 1;
                            // LOGIQUE CORRIGÉE : Si page cible est PAIRE (ex : 4), affiche [4 (gauche), 5 (droite)]
                            if (pageTarget > 1 && pageTarget % 2 === 0) {
                                pageNum = pageTarget;
                            } else if (pageTarget > 1) {
                            // Si page impaire (>1), la garder comme actuellement, sera en gauche
                                pageNum = pageTarget;
                            } else {
                              // Cas couverture ou page 1
                                pageNum = 1;
                            }
                            renderPage(pageNum);
                        }).catch(function(pageErr) {
                            console.warn("Impossible de résoudre la page cible du lien", pageErr, annot, refObj);
                        });
                    });
                }
              // Externe (web)
              else if (annot.url) {
                linkDiv.addEventListener('click', function(e) {
                  e.preventDefault();
                  e.stopPropagation();
                  window.open(annot.url, '_blank');
                });
              }

              linkLayer.appendChild(linkDiv);
            }
          });
        });

        renderCount++;
        if (renderCount === pagesToRender.length) {
          pageRendering = false;
          let pageDisplay = isDoublePage ? `Pages ${num} - ${num + 1}` : `Page ${num}`;
          pageInfo.textContent = pageDisplay + ' / ' + pdfDoc.numPages;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        }
      });
    });
  });

  container.appendChild(wrapper);
}

// Navigation
prevBtn.onclick = function() {
  if (pageNum <= 1) return;
  pageNum = pageNum > 2 ? pageNum - 2 : 1;
  renderPage(pageNum);
};
nextBtn.onclick = function() {
  let maxPages = pdfDoc.numPages;
  let nextPageNum = pageNum === 1 ? 2 : pageNum + 2;
  if (nextPageNum > maxPages) return;
  pageNum = nextPageNum;
  renderPage(pageNum);
};
// Aller directement au sommaire (double page 2-3)
tocBtn.onclick = function() {
    pageNum = 2;
    renderPage(pageNum);
};

pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
  pdfDoc = pdfDoc_;
  renderPage(pageNum);
}).catch(function(err) {
  container.innerHTML = "<b style='color:red'>Erreur PDF : " + err.message + "</b>";
});

</script>
